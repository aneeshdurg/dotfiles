[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fileserver"
version = "0.1.0"
description = "Simple read-only dev fileserver with a sortable, fuzzy-searchable directory listing"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0",
]

[project.scripts]
fileserver = "fileserver.app:main"

[tool.setuptools]
packages = ["fileserver"]

[tool.setuptools.package-data]
fileserver = ["templates/*.html"]
